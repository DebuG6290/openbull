name: DocSync index
on:
  pull_request:
    types: [closed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Explicit approved baseline SHA (only before the first index)
        required: true
permissions:
  contents: read
  pull-requests: read
jobs:
  index:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    uses: DebuG6290/ai-docsync/.github/workflows/docsync-index.yml@028113e1e223c2aa96bb6fe351e5ce5ef8264149
    with:
      # Workflow and application are pinned to the same reviewed multi-repository release.
      application_ref: 028113e1e223c2aa96bb6fe351e5ce5ef8264149
      monitored_branch: "main"
      baseline_sha: ${{ inputs.baseline_sha || '' }}
      retry: ${{ github.run_attempt > 1 }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
