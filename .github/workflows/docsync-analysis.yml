name: DocSync code change
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      before_sha:
        description: Full before SHA of an existing failed analysis (not a new code change)
        required: true
      after_sha:
        description: Full after SHA of that same failed analysis
        required: true
permissions:
  contents: read
jobs:
  analyze:
    uses: DebuG6290/ai-docsync/.github/workflows/docsync-analysis.yml@3c95320159b06dd6d802f8ae346785cb7c778a48
    with:
      # Workflow and application are pinned to the same reviewed multi-repository release.
      application_ref: 3c95320159b06dd6d802f8ae346785cb7c778a48
      monitored_branch: "main"
      retry: ${{ github.event_name == 'workflow_dispatch' || github.run_attempt > 1 }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
